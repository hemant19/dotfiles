set -g default-terminal "tmux-256color"
set -as terminal-features ',*:RGB'

# Set prefix to Ctrl+a
unbind C-b
set-option -g prefix C-z
bind-key C-z send-prefix

# Enable mouse mode
set -g mouse on

# Enable automatic rename.
# Claude Code execs with its version as argv[0], so a plain
# #{pane_current_command} names every agent window "2.1.220". Match that
# version-shaped command and use the project directory instead; do the same
# for bare shells, and fall back to the command for everything else.
set -g status-interval 5
set -g automatic-rename on
set -g automatic-rename-format "#{?#{m:[0-9]*.[0-9]*.[0-9]*,#{pane_current_command}},󰚩 #{b:pane_current_path},#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command}}}"

# Agents that are *attached* still ring the bell when they finish or need a
# permission decision; monitor-bell turns that into a window alert. Backgrounded
# agents are `claude agents`' job instead -- see prefix + a.
set -g monitor-bell on
set -g bell-action other
set -g visual-bell off

# Killing a project session drops into the next one instead of out of tmux.
set -g detach-on-destroy off

# Let OSC sequences through to the terminal -- Claude's progress bar (OSC 9;4)
# and OSC 52 clipboard writes are stripped by tmux without this.
set -g allow-passthrough on
set -g set-clipboard on

# Set a higher scrollback limit
set -g history-limit 100000

# Start window and pane numbering from 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Reload config file
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Split panes
bind | split-window -h
bind - split-window -v

# Use vim keybindings in copy mode
setw -g mode-keys vi

# List of plugins
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

# catppuccin config
set -g @catppuccin_flavour 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'
set -g @catppuccin_directory_text ' #{pane_current_path}'
set -g @catppuccin_date_time_text ' %d-%m-%Y | %H:%M'
set -g status-position top
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -ag status-left "#{E:@catppuccin_status_session}"
# Loop every session and flag the ones with a pending alert, so an agent
# finishing in another project is visible without switching to it.
set -ag status-left "#{S:#{?#{&&:#{session_alerts},#{!=:#{session_name},#{client_session}}},#[fg=#f9e2af]#[bg=#1e1e2e] 󰂚 #{session_name} #[default],}}"
set -g status-right ""
set -ag status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# resurrect, for explicit prefix + C-s / prefix + C-r only. Continuum's
# auto-restore is deliberately off: Claude Code's supervisor already persists
# background agents, so restoring a snapshot of windows on every tmux start just
# resurrects stale ones on top of them.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

bind f run-shell "~/.zsh/scripts/tmux-sessionizer.sh"

# Agent view owns backgrounded agents -- their state, what each is doing, and
# replying to the ones that are blocked. It takes over the whole terminal, so
# give it a full-bleed popup and leave the pane underneath untouched.
bind a display-popup -E -w 100% -h 100% "claude agents"

# Jump to the first session holding a bell. Two escapes are load-bearing here:
# run-shell expands formats *before* handing the string to sh, so the
# per-session format must be written ##{...} or it collapses to the current
# session's value; and tmux expands $var inside a double-quoted config string,
# so the shell's own variable has to be \$s or it arrives empty.
bind b run-shell "s=\$(tmux list-sessions -F '##{?session_alerts,##{session_name},}' | grep -m1 .); [ -n \"\$s\" ] && tmux switch-client -t \"\$s\""

# Session switching
bind Space switch-client -l
bind -n M-] switch-client -n
bind -n M-[ switch-client -p

# Claude publishes its current task into the pane title over OSC. The border is
# off by default -- it costs a row per pane -- but keep the format defined so
# the toggle shows the task rather than tmux's default, and toggle it for a pane
# running something long that you want to watch. Panes running something else
# still have the hostname as their title; show the command for those.
set -g pane-border-format " #{?#{m:#{host_short}*,#{pane_title}},#{pane_current_command},#{pane_title}} "
bind P set -g pane-border-status

# lazygit in a popup, so a quick git detour doesn't disturb an agent's pane.
# The general-purpose shell popup is floax now (prefix + C-t).
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

